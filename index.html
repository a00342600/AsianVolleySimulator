:root{--accent:oklch(45% .18 220);--page:oklch(97% .005 220);--surface:oklch(99% .003 220);--ink:oklch(20% .01 220);--muted:oklch(45% .01 220);--border:oklch(88% .01 220);--qual:oklch(94% .05 145);--highlight:oklch(90% .08 15);--flag-size:1.8rem;--team-size:1.3rem;--card-height:134px;--card-padding:16px;--line-color:oklch(60% .02 220);--line-width:3px;--line-gap:28px;--line-offset-x:50px;--line-top:25%;--line-bottom:74%;--line-length:40px;--bracket-height:50%}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:24px 16px}.wrap{max-width:1220px;margin:auto}h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 18px;letter-spacing:-.02em}.controls{margin-bottom:20px}.btn{border:0;border-radius:8px;background:var(--accent);color:oklch(98% .005 220);padding:11px 24px;font-size:1rem;font-weight:700;cursor:pointer}.bracket-section{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;overflow:hidden;margin-bottom:24px}.bracket-section h2{margin:0 0 20px;font-size:1.1rem}.board{position:relative;display:grid;grid-template-columns:minmax(240px,1fr) 72px minmax(240px,1fr);grid-template-rows:1fr 1fr;gap:var(--line-gap) 18px;min-height:340px}.game{width:100%;height:var(--card-height);padding:var(--card-padding);background:var(--page);border:1px solid var(--border);border-radius:9px;z-index:2}.game:nth-child(1){grid-column:1;grid-row:1}.game:nth-child(2){grid-column:1;grid-row:2}.game:nth-child(3){grid-column:3;grid-row:1}.game:nth-child(4){grid-column:3;grid-row:2}.label{font-size:.72rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px}.tm{height:calc((var(--card-height) - 2*var(--card-padding) - 26px)/2);display:flex;align-items:center;border-bottom:1px solid oklch(92% .005 220);font-size:var(--team-size);font-weight:650;white-space:nowrap}.tm:last-child{border:0}.tm.jp{background:var(--highlight);border-radius:4px;padding:0 6px;margin:0 -6px}.flag{font-size:var(--flag-size);margin:0 6px 0 4px}.seed{font-size:.76em;color:var(--muted);font-weight:400}.line{position:absolute;height:var(--line-width);background:var(--line-color);z-index:1;width:var(--line-length)}.line.l1{left:calc(50% - var(--line-offset-x));top:var(--line-top)}.line.l2{left:calc(50% - var(--line-offset-x));top:var(--line-bottom)}.line.r1{right:calc(50% - var(--line-offset-x));top:var(--line-top)}.line.r2{right:calc(50% - var(--line-offset-x));top:var(--line-bottom)}.line.mid-left{left:calc(50% - var(--line-offset-x));top:var(--line-top);height:var(--bracket-height);width:var(--line-length);background:transparent;border-right:var(--line-width) solid var(--line-color);border-top:var(--line-width) solid var(--line-color);border-bottom:var(--line-width) solid var(--line-color)}.line.mid-right{right:calc(50% - var(--line-offset-x));top:var(--line-top);height:var(--bracket-height);width:var(--line-length);background:transparent;border-left:var(--line-width) solid var(--line-color);border-top:var(--line-width) solid var(--line-color);border-bottom:var(--line-width) solid var(--line-color)}.combined{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px}.combined h2{padding:14px 18px;margin:0;background:oklch(88% .04 220);font-size:1rem}.scroll{overflow-x:auto;padding:14px 18px}.table{width:100%;border-collapse:collapse;font-size:.78rem;white-space:nowrap}.table th{color:var(--muted);font-size:.65rem;padding:6px 5px;border-bottom:1px solid var(--border);text-transform:uppercase}.table td{padding:6px 5px;border-bottom:1px solid oklch(93% .005 220);text-align:center}.table th:nth-child(3),.table td:nth-child(3){text-align:left}.qualified td{background:var(--qual)}.not-qualified td{background:oklch(96% .01 220);color:var(--muted)}.note{font-size:.72rem;color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}.group{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}.group h3{padding:12px 16px;margin:0;background:oklch(92% .03 220);font-size:.95rem}.gbody{padding:12px 16px}.grow{display:grid;grid-template-columns:28px 1fr auto 68px;gap:8px;padding:6px 0;border-bottom:1px solid oklch(93% .005 220);font-size:.84rem;align-items:center}.grow:last-child{border:0}.rank{color:var(--muted);font-size:.72rem}.pts-label{color:var(--muted);font-size:.72rem}.grow input{width:68px;border:1px solid var(--border);border-radius:4px;padding:4px;text-align:center;background:var(--page)}.sub{border-top:1px solid var(--border);padding:12px 16px}.sub h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}.tz-note{font-size:.68rem;color:var(--muted);margin-bottom:6px}.mini{width:100%;border-collapse:collapse;font-size:.74rem}.mini th{color:var(--muted);font-size:.62rem;padding:4px 3px;border-bottom:1px solid var(--border)}.mini td{padding:5px 3px;text-align:center;border-bottom:1px solid oklch(93% .005 220)}.mini td:nth-child(2){text-align:left}.result{padding:6px 0;border-bottom:1px solid oklch(92% .005 220);font-size:.78rem}.result:last-child{border:0}.result-head{display:flex;justify-content:space-between;align-items:center}.result-head span{flex:1}.result-head span:last-child{text-align:right}.result-head b{flex:0 0 50px;text-align:center}.rscores{color:var(--muted);font-size:.7rem;margin-top:2px;text-align:center}.match-date{font-size:.66rem;color:var(--muted);margin-top:6px;margin-bottom:1px}.fixed-tag{font-size:.6rem;color:oklch(55% .12 145);margin-left:4px}
@media(max-width:700px){body{padding:16px 10px}.bracket-section{padding:16px 10px 18px}.bracket-section h2{font-size:1rem;margin-bottom:12px}.board{grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:10px 5px;min-height:330px}.game{height:var(--card-height);padding:var(--card-padding);min-width:0}.tm{font-size:var(--team-size);overflow:hidden}.groups{grid-template-columns:1fr}}@media(max-width:430px){.board{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr)}.game{padding:10px 7px}.label{font-size:.58rem}.tm{font-size:calc(var(--team-size) - .08rem)}.flag{font-size:calc(var(--flag-size) - .12rem);margin-left:2px;margin-right:3px}}

<body>
<main class="wrap">
<h1>2026 アジアバレーボール選手権シミュレーター（男子）</h1>
<div class="controls"><button class="btn" onclick="runSimulation()">試合シミュレーション</button></div>
<section class="bracket-section"><h2>準々決勝 組み合わせ</h2><div class="board"><article class="game"><div class="label">QF 1, #1 vs #8</div><div class="tm" id="t1">未シミュレーション</div><div class="tm" id="t8">未シミュレーション</div></article><article class="game"><div class="label">QF 2, #4 vs #5</div><div class="tm" id="t4">未シミュレーション</div><div class="tm" id="t5">未シミュレーション</div></article><article class="game"><div class="label">QF 3, #3 vs #6</div><div class="tm" id="t3">未シミュレーション</div><div class="tm" id="t6">未シミュレーション</div></article><article class="game"><div class="label">QF 4, #2 vs #7</div><div class="tm" id="t2">未シミュレーション</div><div class="tm" id="t7">未シミュレーション</div></article><i class="line l1"></i><i class="line l2"></i><i class="line r1"></i><i class="line r2"></i><i class="line mid-left"></i><i class="line mid-right"></i></div></section>
<section class="combined"><h2>総合順位表</h2><div class="scroll" id="combinedBody"><em style="color:var(--border)">「試合シミュレーション」をクリックしてください</em></div></section>
<section class="groups" id="groups"></section>
</main>
<script>
var G=[{"n": "プールA", "t": [["日本", 330.0, 6, "🇯🇵"], ["オーストラリア", 140, 49, "🇦🇺"], ["バーレーン", 90, 44, "🇧🇭"], ["オマーン", 70, 63, "🇴🇲"]], "sch": [[0, 3], [1, 2], [0, 2], [3, 1], [0, 1], [2, 3]], "dates": ["9/4 19:30", "9/5 10:00", "9/6 19:30", "9/7 10:00", "9/8 19:30", "9/9 10:00"], "fixed": [{"sa": 3, "sb": 1, "sc": [{"a": 25, "b": 18}, {"a": 25, "b": 13}, {"a": 20, "b": 25}, {"a": 25, "b": 9}]}, {"sa": 3, "sb": 0, "sc": [{"a": 25, "b": 20}, {"a": 25, "b": 18}, {"a": 25, "b": 21}]}]}, {"n": "プールB", "t": [["イラン", 206.6, 19, "🇮🇷"], ["中国", 160.73, 36, "🇨🇳"], ["インド", 110.98, 46, "🇮🇳"], ["ニュージーランド", 67.58, "-", "🇳🇿"]], "sch": [[0, 3], [1, 2], [0, 2], [3, 1], [2, 3], [0, 1]], "dates": ["9/4 12:30", "9/5 13:30", "9/6 10:00", "9/7 13:30", "9/8 10:00", "9/9 17:00"], "fixed": [{"sa": 3, "sb": 0, "sc": [{"a": 25, "b": 15}, {"a": 25, "b": 12}, {"a": 25, "b": 22}]}]}, {"n": "プールC", "t": [["カタール", 131.19, 24, "🇶🇦"], ["韓国", 177.13, 25, "🇰🇷"], ["チャイニーズタイペイ", 113.08, 59, "🇹🇼"], ["タイ", 108.66, 61, "🇹🇭"]], "sch": [[1, 2], [0, 3], [0, 2], [3, 1], [0, 1], [2, 3]], "dates": ["9/4 16:00", "9/5 17:00", "9/6 13:30", "9/7 17:00", "9/8 13:30", "9/9 13:30"], "fixed": [{"sa": 3, "sb": 1, "sc": [{"a": 29, "b": 27}, {"a": 19, "b": 25}, {"a": 25, "b": 15}, {"a": 25, "b": 15}]}]}];
var HIGHLIGHT="日本";
function $(id){return document.getElementById(id)}
function oneSet(base,n,side,gap){var target=n===5?15:25,a=0,b=0,s=Math.random()<.5;while(true){var p=base+(s?-side:side)-(a-b)*gap;p=Math.max(.3,Math.min(.7,p));if(Math.random()<p){a++;s=true}else{b++;s=false}if(a>=target&&a-b>=2)return{a:a,b:b,w:"a"};if(b>=target&&b-a>=2)return{a:a,b:b,w:"b"}}}
function play(A,B,k,side,gap){var sa=0,sb=0,sc=[],base=Math.pow(A.points,k)/(Math.pow(A.points,k)+Math.pow(B.points,k));while(sa<3&&sb<3){var r=oneSet(base,sa+sb+1,side,gap);sc.push(r);if(r.w==="a")sa++;else sb++}return{a:A.name,b:B.name,af:A.flag,bf:B.flag,sa:sa,sb:sb,sc:sc,w:sa>sb?A.name:B.name,isFixed:false}}
function fixedResult(A,B,f){return{a:A.name,b:B.name,af:A.flag,bf:B.flag,sa:f.sa,sb:f.sb,sc:f.sc,w:f.sa>f.sb?A.name:B.name,isFixed:true}}
function standings(ts,rs){var d={};ts.forEach(function(t){d[t.name]={name:t.name,flag:t.flag,pld:0,w:0,l:0,pts:0,sw:0,sl:0,spw:0,spl:0}});rs.forEach(function(r){var a=d[r.a],b=d[r.b];a.pld++;b.pld++;a.sw+=r.sa;a.sl+=r.sb;b.sw+=r.sb;b.sl+=r.sa;r.sc.forEach(function(s){a.spw+=s.a;a.spl+=s.b;b.spw+=s.b;b.spl+=s.a});var x=(r.sa===3&&r.sb===2)||(r.sa===2&&r.sb===3);if(r.w===r.a){a.w++;b.l++;a.pts+=x?2:3;b.pts+=x?1:0}else{b.w++;a.l++;b.pts+=x?2:3;a.pts+=x?1:0}});var arr=[];for(var k2 in d)arr.push(d[k2]);arr.sort(function(a,b){return b.w-a.w||b.pts-a.pts||(b.sw/b.sl)-(a.sw/a.sl)||(b.spw/b.spl)-(a.spw/a.spl)});return arr}
function ratio(a,b){return b?(a/b).toFixed(3):"—"}
function teamHTML(seed,flag,name){return '<span class="seed">#'+seed+'</span><span class="flag">'+flag+'</span><span>'+name+'</span>'}
function renderGroups(){var html="";G.forEach(function(g,gi){html+='<article class="group"><h3>'+g.n+'</h3><div class="gbody">';g.t.forEach(function(t,ti){html+='<div class="grow"><span class="rank">#'+t[2]+'</span><span>'+t[3]+' '+t[0]+'</span><span class="pts-label">実力値</span><input type="number" value="'+t[1]+'" step=".01" onchange="G['+gi+'].t['+ti+'][1]=parseFloat(this.value)||1"></div>'});html+='</div><div class="sub" id="st'+gi+'"><h4>プール順位</h4><em style="color:var(--border);font-size:.78rem">シミュレーション後に表示</em></div><div class="sub" id="ma'+gi+'"><h4>試合結果</h4><em style="color:var(--border);font-size:.78rem">シミュレーション後に表示</em></div></article>'});$("groups").innerHTML=html}
function renderSt(gi,s){var html='<h4>プール順位</h4><table class="mini"><thead><tr><th>順位</th><th>チーム</th><th>勝</th><th>敗</th><th>勝点</th><th>SW</th><th>SL</th><th>SR</th><th>SPR</th></tr></thead><tbody>';s.forEach(function(x,i){html+='<tr><td>'+(i+1)+'</td><td>'+x.flag+' '+x.name+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td><b>'+x.pts+'</b></td><td>'+x.sw+'</td><td>'+x.sl+'</td><td>'+ratio(x.sw,x.sl)+'</td><td>'+ratio(x.spw,x.spl)+'</td></tr>'});html+='</tbody></table>';$('st'+gi).innerHTML=html}
function renderMa(gi,rs,dates){var html='<h4>試合結果</h4>';if(dates){html+='<div class="tz-note">※ 時刻は日本時間 (JST)</div>'}rs.forEach(function(r,ri){if(dates&&dates[ri]){html+='<div class="match-date">'+dates[ri]+'</div>'}var tag=r.isFixed?'<span class="fixed-tag">[確定]</span>':'';html+='<div class="result"><div class="result-head"><span>'+r.af+' '+r.a+'</span><b>'+r.sa+'-'+r.sb+tag+'</b><span>'+r.bf+' '+r.b+'</span></div><div class="rscores">';var scores=[];r.sc.forEach(function(s){scores.push(s.a+'-'+s.b)});html+=scores.join(' · ')+'</div></div>'});$('ma'+gi).innerHTML=html}
function runSimulation(){var k=0.26,side=0.07,gap=0.005,all=[];G.forEach(function(g,gi){var ts=g.t.map(function(x){return{name:x[0],points:x[1],rank:x[2],flag:x[3]}});var rs=[];g.sch.forEach(function(pair,mi){if(g.fixed&&g.fixed[mi]){rs.push(fixedResult(ts[pair[0]],ts[pair[1]],g.fixed[mi]))}else{rs.push(play(ts[pair[0]],ts[pair[1]],k,side,gap))}});var s=standings(ts,rs);all.push(s);renderSt(gi,s);renderMa(gi,rs,g.dates)});var c=[];all.forEach(function(s,g){s.forEach(function(x,i){var o={};for(var k2 in x)o[k2]=x[k2];o.pool="ABC"[g];o.poolPos=i+1;c.push(o)})});c.sort(function(x,y){return x.poolPos-y.poolPos||y.w-x.w||y.pts-x.pts||(y.sw/y.sl)-(x.sw/x.sl)||(y.spw/y.spl)-(x.spw/x.spl)});var h='<table class="table"><thead><tr><th>順位</th><th>プール</th><th>チーム</th><th>勝</th><th>敗</th><th>勝点</th><th>SW</th><th>SL</th><th>SR</th><th>SPR</th><th>備考</th></tr></thead><tbody>';c.forEach(function(x,i){h+='<tr class="'+(i<8?'qualified':'not-qualified')+'"><td>'+(i+1)+'</td><td>'+x.pool+'</td><td>'+x.flag+' '+x.name+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td><b>'+x.pts+'</b></td><td>'+x.sw+'</td><td>'+x.sl+'</td><td>'+ratio(x.sw,x.sl)+'</td><td>'+ratio(x.spw,x.spl)+'</td><td class="note">'+(i<8?'準々決勝進出':'敗退')+'</td></tr>'});$("combinedBody").innerHTML=h+'</tbody></table>';var order=[[0,7],[3,4],[2,5],[1,6]];var slots=['t1','t8','t4','t5','t3','t6','t2','t7'];var seeds=[1,8,4,5,3,6,2,7];order.forEach(function(pair,qi){var el1=$(slots[qi*2]);var el2=$(slots[qi*2+1]);var a=c[pair[0]],b=c[pair[1]];el1.className='tm'+(a.name===HIGHLIGHT?' jp':'');el2.className='tm'+(b.name===HIGHLIGHT?' jp':'');el1.innerHTML=teamHTML(seeds[qi*2],a.flag,a.name);el2.innerHTML=teamHTML(seeds[qi*2+1],b.flag,b.name)})}
renderGroups();
</script>
