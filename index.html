<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 アジアバレーボール選手権シミュレーター</title>
<style>
:root{--accent:oklch(45% .18 220);--page:oklch(97% .005 220);--surface:oklch(99% .003 220);--ink:oklch(20% .01 220);--muted:oklch(45% .01 220);--border:oklch(88% .01 220);--qual:oklch(94% .05 145);--highlight:oklch(90% .08 15);--flag-size:1.8rem;--team-size:1.3rem;--card-height:134px;--card-padding:16px;--line-color:oklch(60% .02 220);--line-width:3px;--line-gap:28px;--line-offset-x:50px;--line-top:25%;--line-bottom:74%;--line-length:40px;--bracket-height:50%}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:24px 16px}.wrap{max-width:1220px;margin:auto}h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 18px;letter-spacing:-.02em}.controls{margin-bottom:20px}.btn{border:0;border-radius:8px;background:var(--accent);color:oklch(98% .005 220);padding:11px 24px;font-size:1rem;font-weight:700;cursor:pointer}.bracket-section{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 24px 28px;overflow:hidden;margin-bottom:24px}.bracket-section h2{margin:0 0 20px;font-size:1.1rem}.board{position:relative;display:grid;grid-template-columns:minmax(240px,1fr) 72px minmax(240px,1fr);grid-template-rows:1fr 1fr;gap:var(--line-gap) 18px;min-height:340px}.game{width:100%;height:var(--card-height);padding:var(--card-padding);background:var(--page);border:1px solid var(--border);border-radius:9px;z-index:2}.game:nth-child(1){grid-column:1;grid-row:1}.game:nth-child(2){grid-column:1;grid-row:2}.game:nth-child(3){grid-column:3;grid-row:1}.game:nth-child(4){grid-column:3;grid-row:2}.label{font-size:.72rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px}.tm{height:calc((var(--card-height) - 2*var(--card-padding) - 26px)/2);display:flex;align-items:center;border-bottom:1px solid oklch(92% .005 220);font-size:var(--team-size);font-weight:650;white-space:nowrap}.tm:last-child{border:0}.tm.jp{background:var(--highlight);border-radius:4px;padding:0 6px;margin:0 -6px}.flag{font-size:var(--flag-size);margin:0 6px 0 4px}.seed{font-size:.76em;color:var(--muted);font-weight:400}.line{position:absolute;height:var(--line-width);background:var(--line-color);z-index:1;width:var(--line-length)}.line.l1{left:calc(50% - var(--line-offset-x));top:var(--line-top)}.line.l2{left:calc(50% - var(--line-offset-x));top:var(--line-bottom)}.line.r1{right:calc(50% - var(--line-offset-x));top:var(--line-top)}.line.r2{right:calc(50% - var(--line-offset-x));top:var(--line-bottom)}.line.mid-left{left:calc(50% - var(--line-offset-x));top:var(--line-top);height:var(--bracket-height);width:var(--line-length);background:transparent;border-right:var(--line-width) solid var(--line-color);border-top:var(--line-width) solid var(--line-color);border-bottom:var(--line-width) solid var(--line-color)}.line.mid-right{right:calc(50% - var(--line-offset-x));top:var(--line-top);height:var(--bracket-height);width:var(--line-length);background:transparent;border-left:var(--line-width) solid var(--line-color);border-top:var(--line-width) solid var(--line-color);border-bottom:var(--line-width) solid var(--line-color)}.combined{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px}.combined h2{padding:14px 18px;margin:0;background:oklch(88% .04 220);font-size:1rem}.scroll{overflow-x:auto;padding:14px 18px}.table{width:100%;border-collapse:collapse;font-size:.78rem;white-space:nowrap}.table th{color:var(--muted);font-size:.65rem;padding:6px 5px;border-bottom:1px solid var(--border);text-transform:uppercase}.table td{padding:6px 5px;border-bottom:1px solid oklch(93% .005 220);text-align:center}.table th:nth-child(3),.table td:nth-child(3){text-align:left}.qualified td{background:var(--qual)}.not-qualified td{background:oklch(96% .01 220);color:var(--muted)}.note{font-size:.72rem;color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}.group{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}.group h3{padding:12px 16px;margin:0;background:oklch(92% .03 220);font-size:.95rem}.gbody{padding:12px 16px}.grow{display:grid;grid-template-columns:28px 1fr auto 68px;gap:8px;padding:6px 0;border-bottom:1px solid oklch(93% .005 220);font-size:.84rem;align-items:center}.grow:last-child{border:0}.rank{color:var(--muted);font-size:.72rem}.pts-label{color:var(--muted);font-size:.72rem}.grow input{width:68px;border:1px solid var(--border);border-radius:4px;padding:4px;text-align:center;background:var(--page)}.sub{border-top:1px solid var(--border);padding:12px 16px}.sub h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}.mini{width:100%;border-collapse:collapse;font-size:.74rem}.mini th{color:var(--muted);font-size:.62rem;padding:4px 3px;border-bottom:1px solid var(--border)}.mini td{padding:5px 3px;text-align:center;border-bottom:1px solid oklch(93% .005 220)}.mini td:nth-child(2){text-align:left}.result{padding:6px 0;border-bottom:1px solid oklch(92% .005 220);font-size:.78rem}.result:last-child{border:0}.result-head{display:flex;justify-content:space-between}.rscores{color:var(--muted);font-size:.7rem;margin-top:2px}
@media(max-width:700px){body{padding:16px 10px}.bracket-section{padding:16px 10px 18px}.bracket-section h2{font-size:1rem;margin-bottom:12px}.board{grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:10px 5px;min-height:330px}.game{height:var(--card-height);padding:var(--card-padding);min-width:0}.tm{font-size:var(--team-size);overflow:hidden}.groups{grid-template-columns:1fr}}
@media(max-width:430px){.board{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr)}.game{padding:10px 7px}.label{font-size:.58rem}.tm{font-size:calc(var(--team-size) - .08rem)}.flag{font-size:calc(var(--flag-size) - .12rem);margin-left:2px;margin-right:3px}}
</style>
</head>
<body>
<main class="wrap">
<h1>2026 アジアバレーボール選手権シミュレーター</h1>
<div class="controls">
<button class="btn" onclick="runSimulation()">試合シミュレーション</button>
</div>
<section class="bracket-section">
<h2>準々決勝 組み合わせ</h2>
<div class="board">
<article class="game"><div class="label">QF 1, #1 vs #8</div><div class="tm" id="t1">未シミュレーション</div><div class="tm" id="t8">未シミュレーション</div></article>
<article class="game"><div class="label">QF 2, #4 vs #5</div><div class="tm" id="t4">未シミュレーション</div><div class="tm" id="t5">未シミュレーション</div></article>
<article class="game"><div class="label">QF 3, #3 vs #6</div><div class="tm" id="t3">未シミュレーション</div><div class="tm" id="t6">未シミュレーション</div></article>
<article class="game"><div class="label">QF 4, #2 vs #7</div><div class="tm" id="t2">未シミュレーション</div><div class="tm" id="t7">未シミュレーション</div></article>
<i class="line l1"></i><i class="line l2"></i><i class="line r1"></i><i class="line r2"></i><i class="line mid-left"></i><i class="line mid-right"></i>
</div>
</section>
<section class="combined">
<h2>総合順位表</h2>
<div class="scroll" id="combinedBody"><em style="color:var(--border)">「試合シミュレーション」をクリックしてください</em></div>
</section>
<section class="groups" id="groups"></section>
</main>
<script>
var G=[{n:"\u30d7\u30fc\u30ebA",t:[["\u65e5\u672c",333.33,6,"\ud83c\uddef\ud83c\uddf5"],["\u30aa\u30fc\u30b9\u30c8\u30e9\u30ea\u30a2",93.81,49,"\ud83c\udde6\ud83c\uddfa"],["\u30d0\u30fc\u30ec\u30fc\u30f3",102.66,44,"\ud83c\udde7\ud83c\udded"],["\u30aa\u30de\u30fc\u30f3",67.65,63,"\ud83c\uddf4\ud83c\uddf2"]]},{n:"\u30d7\u30fc\u30ebB",t:[["\u30a4\u30e9\u30f3",205.6,19,"\ud83c\uddee\ud83c\uddf7"],["\u4e2d\u56fd",140,36,"\ud83c\udde8\ud83c\uddf3"],["\u30a4\u30f3\u30c9",90,46,"\ud83c\uddee\ud83c\uddf3"],["\u30cb\u30e5\u30fc\u30b8\u30fc\u30e9\u30f3\u30c9",50,"-","\ud83c\uddf3\ud83c\uddff"]]},{n:"\u30d7\u30fc\u30ebC",t:[["\u30ab\u30bf\u30fc\u30eb",147.82,24,"\ud83c\uddf6\ud83c\udde6"],["\u97d3\u56fd",140.15,25,"\ud83c\uddf0\ud83c\uddf7"],["\u30c1\u30e3\u30a4\u30cb\u30fc\u30ba\u30bf\u30a4\u30da\u30a4",74.55,59,"\ud83c\uddf9\ud83c\uddfc"],["\u30bf\u30a4",70.16,61,"\ud83c\uddf9\ud83c\udded"]]}];
var HIGHLIGHT="\u65e5\u672c";
function $(id){return document.getElementById(id)}
function pairs(t){var a=[];for(var i=0;i<t.length;i++)for(var j=i+1;j<t.length;j++)a.push([t[i],t[j]]);return a}
function oneSet(base,n,side){var target=n===5?15:25,a=0,b=0,s=Math.random()<.5;while(true){var p=Math.max(.3,Math.min(.7,base+(s?-side:side)));if(Math.random()<p){a++;s=true}else{b++;s=false}if(a>=target&&a-b>=2)return{a:a,b:b,w:"a"};if(b>=target&&b-a>=2)return{a:a,b:b,w:"b"}}}
function play(A,B,k,side){var sa=0,sb=0,sc=[],base=Math.pow(A.points,k)/(Math.pow(A.points,k)+Math.pow(B.points,k));while(sa<3&&sb<3){var r=oneSet(base,sa+sb+1,side);sc.push(r);if(r.w==="a")sa++;else sb++}return{a:A.name,b:B.name,sa:sa,sb:sb,sc:sc,w:sa>sb?A.name:B.name}}
function standings(ts,rs){var d={};ts.forEach(function(t){d[t.name]={name:t.name,flag:t.flag,pld:0,w:0,l:0,pts:0,sw:0,sl:0,spw:0,spl:0}});rs.forEach(function(r){var a=d[r.a],b=d[r.b];a.pld++;b.pld++;a.sw+=r.sa;a.sl+=r.sb;b.sw+=r.sb;b.sl+=r.sa;r.sc.forEach(function(s){a.spw+=s.a;a.spl+=s.b;b.spw+=s.b;b.spl+=s.a});var x=(r.sa===3&&r.sb===2)||(r.sa===2&&r.sb===3);if(r.w===r.a){a.w++;b.l++;a.pts+=x?2:3;b.pts+=x?1:0}else{b.w++;a.l++;b.pts+=x?2:3;a.pts+=x?1:0}});var arr=[];for(var k2 in d)arr.push(d[k2]);arr.sort(function(a,b){return b.w-a.w||b.pts-a.pts||(b.sw/b.sl)-(a.sw/a.sl)||(b.spw/b.spl)-(a.spw/a.spl)});return arr}
function ratio(a,b){return b?(a/b).toFixed(3):"\u2014"}
function teamHTML(seed,flag,name){return '<span class="seed">#'+seed+'</span><span class="flag">'+flag+'</span><span>'+name+'</span>'}
function renderGroups(){var html="";G.forEach(function(g,gi){html+='<article class="group"><h3>'+g.n+'</h3><div class="gbody">';g.t.forEach(function(t,ti){html+='<div class="grow"><span class="rank">#'+t[2]+'</span><span>'+t[3]+' '+t[0]+'</span><span class="pts-label">\u30dd\u30a4\u30f3\u30c8</span><input type="number" value="'+t[1]+'" step=".01" onchange="G['+gi+'].t['+ti+'][1]=parseFloat(this.value)||1"></div>'});html+='</div><div class="sub" id="st'+gi+'"><h4>\u30d7\u30fc\u30eb\u9806\u4f4d</h4><em style="color:var(--border);font-size:.78rem">\u30b7\u30df\u30e5\u30ec\u30fc\u30b7\u30e7\u30f3\u5f8c\u306b\u8868\u793a</em></div><div class="sub" id="ma'+gi+'"><h4>\u8a66\u5408\u7d50\u679c</h4><em style="color:var(--border);font-size:.78rem">\u30b7\u30df\u30e5\u30ec\u30fc\u30b7\u30e7\u30f3\u5f8c\u306b\u8868\u793a</em></div></article>'});$("groups").innerHTML=html}
function renderSt(gi,s){var html='<h4>\u30d7\u30fc\u30eb\u9806\u4f4d</h4><table class="mini"><thead><tr><th>\u9806\u4f4d</th><th>\u30c1\u30fc\u30e0</th><th>\u52dd</th><th>\u6557</th><th>\u52dd\u70b9</th><th>SW</th><th>SL</th><th>SR</th><th>SPR</th></tr></thead><tbody>';s.forEach(function(x,i){html+='<tr><td>'+(i+1)+'</td><td>'+x.flag+' '+x.name+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td><b>'+x.pts+'</b></td><td>'+x.sw+'</td><td>'+x.sl+'</td><td>'+ratio(x.sw,x.sl)+'</td><td>'+ratio(x.spw,x.spl)+'</td></tr>'});html+='</tbody></table>';$('st'+gi).innerHTML=html}
function renderMa(gi,rs){var html='<h4>\u8a66\u5408\u7d50\u679c</h4>';rs.forEach(function(r){html+='<div class="result"><div class="result-head"><span>'+r.a+'</span><b>'+r.sa+'-'+r.sb+'</b><span>'+r.b+'</span></div><div class="rscores">';var scores=[];r.sc.forEach(function(s){scores.push(s.a+'-'+s.b)});html+=scores.join(' \u00b7 ')+'</div></div>'});$('ma'+gi).innerHTML=html}
function runSimulation(){
  var k=0.24;
  var side=0.07;
  var all=[];
  G.forEach(function(g,gi){
    var ts=g.t.map(function(x){return{name:x[0],points:x[1],rank:x[2],flag:x[3]}});
    var rs=pairs(ts).map(function(x){return play(x[0],x[1],k,side)});
    var s=standings(ts,rs);
    all.push(s);renderSt(gi,s);renderMa(gi,rs);
  });
  var c=[];
  all.forEach(function(s,g){s.forEach(function(x,i){var o={};for(var k2 in x)o[k2]=x[k2];o.pool="ABC"[g];o.poolPos=i+1;c.push(o)})});
  c.sort(function(x,y){return x.poolPos-y.poolPos||y.w-x.w||y.pts-x.pts||(y.sw/y.sl)-(x.sw/x.sl)||(y.spw/y.spl)-(x.spw/x.spl)});
  var h='<table class="table"><thead><tr><th>\u9806\u4f4d</th><th>\u30d7\u30fc\u30eb</th><th>\u30c1\u30fc\u30e0</th><th>\u52dd</th><th>\u6557</th><th>\u52dd\u70b9</th><th>SW</th><th>SL</th><th>SR</th><th>SPR</th><th>\u5099\u8003</th></tr></thead><tbody>';
  c.forEach(function(x,i){h+='<tr class="'+(i<8?'qualified':'not-qualified')+'"><td>'+(i+1)+'</td><td>'+x.pool+'</td><td>'+x.flag+' '+x.name+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td><b>'+x.pts+'</b></td><td>'+x.sw+'</td><td>'+x.sl+'</td><td>'+ratio(x.sw,x.sl)+'</td><td>'+ratio(x.spw,x.spl)+'</td><td class="note">'+(i<8?'\u6e96\u3005\u6c7a\u52dd\u9032\u51fa':'\u6557\u9000')+'</td></tr>'});
  $("combinedBody").innerHTML=h+'</tbody></table>';
  var order=[[0,7],[3,4],[2,5],[1,6]];
  var slots=['t1','t8','t4','t5','t3','t6','t2','t7'];
  var seeds=[1,8,4,5,3,6,2,7];
  order.forEach(function(pair,qi){
    var el1=$(slots[qi*2]);
    var el2=$(slots[qi*2+1]);
    var a=c[pair[0]],b=c[pair[1]];
    el1.className='tm'+(a.name===HIGHLIGHT?' jp':'');
    el2.className='tm'+(b.name===HIGHLIGHT?' jp':'');
    el1.innerHTML=teamHTML(seeds[qi*2],a.flag,a.name);
    el2.innerHTML=teamHTML(seeds[qi*2+1],b.flag,b.name);
  });
}
renderGroups();
</script>
</body>
</html>
